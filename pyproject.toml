[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "x-research-interface"
version = "0.1.0"
description = "Descargas reproducibles de X con seguimiento e interfaz local"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.0,<4",
  "pandas>=2.2,<4",
  "streamlit>=1.49,<2",
  "twscrape[curl]==0.20.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.9,<1",
]
mass = ["pyarrow>=20,<27"]

[project.scripts]
x-research = "x_research.cli:main"
x-research-ui = "ui.runtime:run_streamlit"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
